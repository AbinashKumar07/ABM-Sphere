<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Page Not Found | ABM Sphere</title>
<style>
  :root {
    --bg: #080810;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.16);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38e8ff;
    --accent-2: #1d6bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, rgba(29, 107, 255, 0.25), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(56, 232, 255, 0.15), transparent 50%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 520px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    backdrop-filter: blur(12px);
  }
  .code {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #050814; }
  .secondary { border: 1px solid var(--border); color: var(--text); background: rgba(255, 255, 255, 0.05); }
  a:hover { transform: translateY(-1px); opacity: 0.92; }
</style>
</head>
<body>
  <main role="main" aria-labelledby="nf-title">
    <div class="code" aria-hidden="true">404</div>
    <h1 id="nf-title">Route Not Found</h1>
    <p>The page or resource you requested does not exist on this ABM Sphere server. Return to the workspace or check system health.</p>
    <div class="actions">
      <a class="primary" href="/">← Return to ABM Sphere</a>
      <a class="secondary" href="/api/health">System Health</a>
    </div>
  </main>
</body>
</html>
